<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收款功能 App 互动原型</title>
  <style>
    :root {
      --ink: #0f172a;
      --ink-2: #1e293b;
      --muted: #64748b;
      --soft: #94a3b8;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --page: #f6f8fb;
      --card: #ffffff;
      --bg: #f1f5f9;

      --mint: #10b981;
      --mint-soft: #ecfdf5;
      --mint-ink: #047857;

      --primary: #0054ff;
      --primary-soft: #e6efff;
      --primary-ink: #003fcc;

      --sky: #0054ff;
      --sky-2: #003fcc;
      --sky-soft: #e6efff;
      --sky-ink: #003fcc;

      --coral: #ef4444;
      --coral-soft: #fef2f2;
      --coral-ink: #b91c1c;

      --amber: #f59e0b;
      --amber-soft: #fffbeb;
      --amber-ink: #b45309;

      --violet: #8b5cf6;
      --violet-soft: #f5f3ff;
      --violet-ink: #6d28d9;

      --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
      --shadow-md: 0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
      --shadow-lg: 0 16px 36px rgba(15,23,42,.10), 0 4px 10px rgba(15,23,42,.05);

      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-xl: 24px;
    }

    * { box-sizing: border-box; }
    html, body { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, #dbeafe55, transparent 60%),
        radial-gradient(900px 500px at -10% 110%, #ede9fe55, transparent 60%),
        #eef2f7;
      min-height: 100vh;
    }

    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .stage {
      width: min(1480px, calc(100vw - 40px));
      margin: 28px auto 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; }
    .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 720px; }

    .route-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      max-width: 56vw;
    }
    .route-tabs button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      transition: all .15s ease;
    }
    .route-tabs button:hover { color: var(--ink); border-color: var(--line-strong); }
    .route-tabs button.active {
      border-color: var(--sky);
      background: var(--sky);
      color: #fff;
      box-shadow: 0 6px 14px rgba(0,84,255,.28);
    }

    .devices {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 28px;
      align-items: start;
    }

    .device-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 4px 10px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
    }
    .hint { color: var(--soft); font-weight: 600; }

    .phone-shell, .pad-shell {
      background: linear-gradient(180deg, #1f2937, #0f172a);
      box-shadow: 0 30px 60px -20px rgba(15,23,42,.35), 0 10px 30px rgba(15,23,42,.18);
    }
    .phone-shell { border-radius: 44px; padding: 12px; }
    .pad-shell { border-radius: 28px; padding: 12px; }

    .screen {
      background: var(--page);
      min-height: 820px;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .pad-screen { min-height: 720px; border-radius: 18px; }

    .status {
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      flex: 0 0 auto;
    }
    .status .right { display: inline-flex; align-items: center; gap: 6px; }
    .status svg { display: block; }

    .nav {
      height: 52px;
      display: grid;
      grid-template-columns: 44px 1fr 80px;
      align-items: center;
      padding: 0 12px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .pad .nav { grid-template-columns: 44px 1fr auto; }

    .back {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 0; border-radius: 12px;
      background: var(--bg); color: var(--ink);
    }
    .back:hover { background: var(--line); }

    .nav h2 {
      margin: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }

    .nav-action {
      min-width: 64px; height: 30px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: var(--sky-soft); color: var(--sky-ink);
      font-size: 12.5px; font-weight: 700;
      justify-self: end;
    }

    .content {
      padding: 14px;
      flex: 1;
      overflow-y: auto;
    }
    .content > * + * { margin-top: 12px; }

    /* Hero — slimmed down with Chinese eyebrow chip */
    .hero {
      position: relative;
      padding: 14px 16px;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, #ffffff 0%, #e6efff 100%);
      border: 1px solid #d2dcff;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0,84,255,.10), transparent);
    }
    .hero.settle { background: linear-gradient(135deg, #ffffff, #fffbeb); border-color: #fde8b0; }
    .hero.settle::after { background: radial-gradient(closest-side, rgba(245,158,11,.12), transparent); }
    .hero.notice { background: linear-gradient(135deg, #ffffff, #fef2f2); border-color: #fecaca; }
    .hero.notice::after { background: radial-gradient(closest-side, rgba(239,68,68,.10), transparent); }
    .hero.detail { background: linear-gradient(135deg, #ffffff, #f5f3ff); border-color: #ddd6fe; }
    .hero.detail::after { background: radial-gradient(closest-side, rgba(139,92,246,.10), transparent); }

    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 5px;
      height: 22px; padding: 0 9px;
      border-radius: 999px;
      background: rgba(0,84,255,.12); color: var(--sky-ink);
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
    }
    .hero.settle .hero-eyebrow { background: rgba(245,158,11,.14); color: var(--amber-ink); }
    .hero.notice .hero-eyebrow { background: rgba(239,68,68,.10); color: var(--coral-ink); }
    .hero.detail .hero-eyebrow { background: rgba(139,92,246,.14); color: var(--violet-ink); }

    .hero h3 { margin: 8px 0 4px; font-size: 19px; line-height: 1.3; font-weight: 700; }
    .hero p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }

    /* Card system */
    .card {
      padding: 14px;
      background: var(--card);
      border-radius: var(--r-lg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .card.flat { box-shadow: none; }
    .card.tint-sky { background: linear-gradient(180deg, var(--sky-soft), #fff); border-color: #cfdcff; }
    .card.tint-mint { background: linear-gradient(180deg, var(--mint-soft), #fff); border-color: #bbf7d0; }
    .card.tint-amber { background: linear-gradient(180deg, var(--amber-soft), #fff); border-color: #fde68a; }
    .card.tint-coral { background: linear-gradient(180deg, var(--coral-soft), #fff); border-color: #fecaca; }

    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 12px;
    }
    .card-title {
      margin: 0; font-size: 15px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .card-title .icon { width: 28px; height: 28px; border-radius: 9px; }
    .card-action {
      display: inline-flex; align-items: center; gap: 4px;
      height: 28px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--sky-ink);
      font-size: 12px; font-weight: 700;
    }
    .card-action:hover { border-color: var(--sky); }

    /* Icon container */
    .icon {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--sky-soft); color: var(--sky-ink);
      flex: 0 0 auto;
    }
    .icon.mint { background: var(--mint-soft); color: var(--mint-ink); }
    .icon.amber { background: var(--amber-soft); color: var(--amber-ink); }
    .icon.coral { background: var(--coral-soft); color: var(--coral-ink); }
    .icon.violet { background: var(--violet-soft); color: var(--violet-ink); }
    .icon svg { width: 16px; height: 16px; }
    .icon.lg { width: 40px; height: 40px; border-radius: 12px; }
    .icon.lg svg { width: 20px; height: 20px; }

    /* Filter chips & segmented control */
    .filter-row {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .chip {
      height: 30px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--muted);
      font-size: 12.5px; font-weight: 600;
    }
    .chip.active { border-color: var(--sky); background: var(--sky-soft); color: var(--sky-ink); }
    .chip:hover { border-color: var(--line-strong); }

    .seg {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--bg);
      width: 100%;
    }
    .seg > span {
      height: 30px;
      display: grid; place-items: center;
      border-radius: 9px;
      color: var(--muted);
      font-size: 12.5px; font-weight: 700;
      cursor: pointer;
    }
    .seg > span.active { background: #fff; color: var(--sky-ink); box-shadow: var(--shadow-sm); }

    .field {
      min-height: 38px;
      display: inline-flex; align-items: center; justify-content: space-between;
      gap: 6px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--ink);
      font-size: 13px; font-weight: 500;
    }
    .field .placeholder { color: var(--soft); font-weight: 500; }
    .field .leading { color: var(--muted); font-size: 11px; font-weight: 700; }
    .field.select::after {
      content: ""; width: 7px; height: 7px;
      border-right: 2px solid var(--soft); border-bottom: 2px solid var(--soft);
      transform: rotate(45deg) translateY(-2px);
      flex: 0 0 auto;
    }
    /* In-box label + value: label is pinned (flex:0 0 auto + border-right),
       value gets ellipsis so long content never pushes or covers the label. */
    .field.select { gap: 0; }
    .field.select > .leading {
      flex: 0 0 auto;
      padding-right: 10px;
      margin-right: 10px;
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 11.5px; font-weight: 700;
      letter-spacing: .02em;
      line-height: 1;
    }
    .field.select > .value {
      flex: 1 1 auto; min-width: 0;
      text-align: left;
      color: var(--ink);
      font-size: 13px; font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-grid {
      display: grid; gap: 8px;
      grid-template-columns: repeat(2, 1fr);
    }
    .filter-grid .wide { grid-column: 1 / -1; }

    /* Dropdown row — strict label / value partition.
       Stacked = label on top (mobile-friendly).
       Row     = label on left, value on right; value wraps inside its own column
                 so the label never gets pushed or covered. */
    .dd-row {
      display: grid;
      gap: 6px 12px;
      align-items: start;
    }
    .dd-row.stacked { grid-template-columns: 1fr; }
    .dd-row.row { grid-template-columns: 88px 1fr; }
    .dd-row.row.wide-label { grid-template-columns: 96px 1fr; }
    .dd-label {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 28px;
    }
    .dd-value {
      display: flex; flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .dd-value > * { flex: 0 1 auto; }
    .dd-value .field { width: 100%; }
    .dd-chip {
      display: inline-flex; align-items: center;
      height: 28px; padding: 0 10px;
      border-radius: 999px;
      background: var(--primary-soft); color: var(--primary-ink);
      font-size: 12.5px; font-weight: 600;
    }
    .dd-stack {
      display: grid; gap: 10px;
    }

    /* Search input — strictly left aligned (text + placeholder). */
    .search {
      display: flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: #fff;
    }
    .search > svg {
      flex: 0 0 auto;
      width: 16px; height: 16px;
      color: var(--soft);
    }
    .search input,
    .search .search-placeholder {
      flex: 1; min-width: 0;
      border: 0; outline: 0;
      background: transparent;
      text-align: left;
      font-size: 13px; color: var(--ink);
    }
    .search input::placeholder { color: var(--soft); text-align: left; }
    .search .search-placeholder { color: var(--soft); line-height: 38px; }
    .pad .search { height: 36px; }
    .pad .search .search-placeholder { line-height: 34px; }

    /* Buttons */
    .btn {
      min-height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 13.5px; font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: all .15s ease;
    }
    .btn.primary {
      background: var(--sky); color: #fff;
      box-shadow: 0 8px 18px rgba(0,84,255,.22);
    }
    .btn.primary:hover { background: var(--sky-2); }
    .btn.ghost {
      background: #fff; color: var(--sky-ink);
      border-color: var(--line);
    }
    .btn.ghost:hover { border-color: var(--sky); }
    .btn.link {
      min-height: 28px; padding: 0;
      background: transparent; color: var(--sky-ink);
      font-weight: 700;
    }
    .btn.block { width: 100%; }
    .btn.sm { min-height: 32px; padding: 0 12px; font-size: 12.5px; }

    /* Tags */
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px;
      border-radius: 999px;
      background: var(--mint-soft); color: var(--mint-ink);
      font-size: 11.5px; font-weight: 700;
    }
    .tag.blue { background: var(--sky-soft); color: var(--sky-ink); }
    .tag.amber { background: var(--amber-soft); color: var(--amber-ink); }
    .tag.coral { background: var(--coral-soft); color: var(--coral-ink); }
    .tag.violet { background: var(--violet-soft); color: var(--violet-ink); }
    .tag.gray { background: var(--bg); color: var(--muted); }
    .tag-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Key-value */
    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px 12px;
      font-size: 13px;
    }
    .kv > span { color: var(--muted); }
    .kv > b { color: var(--ink); font-weight: 600; word-break: break-all; }

    /* Stat grid */
    .stat-grid {
      display: grid; gap: 10px;
      grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    }
    .stat {
      padding: 12px;
      border-radius: 12px;
      background: var(--bg);
    }
    .stat label { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .stat small { display: block; margin-top: 2px; color: var(--soft); font-size: 11.5px; }
    .stat.bordered { background: #fff; border: 1px solid var(--line); }
    .stat.accent-sky { background: var(--sky-soft); }
    .stat.accent-sky strong { color: var(--sky-ink); }
    .stat.accent-mint { background: var(--mint-soft); }
    .stat.accent-mint strong { color: var(--mint-ink); }
    .stat.accent-amber { background: var(--amber-soft); }
    .stat.accent-amber strong { color: var(--amber-ink); }
    .stat.accent-coral { background: var(--coral-soft); }
    .stat.accent-coral strong { color: var(--coral-ink); }

    /* Action cards on overview */
    .quick {
      display: grid; gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    .quick-card {
      padding: 14px;
      border-radius: var(--r-lg);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .quick-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
    .quick-card header { display: flex; align-items: center; gap: 8px; }
    .quick-card .title { font-size: 14px; font-weight: 700; }
    .quick-card .lead {
      margin-top: 10px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    }
    .quick-card .lead.muted { color: var(--muted); font-size: 15px; font-weight: 600; }
    .quick-card .sub-stat { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .quick-card footer {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed var(--line);
      display: flex; justify-content: space-between; align-items: center;
      color: var(--sky-ink); font-size: 12px; font-weight: 700;
    }

    /* Record list */
    .list-rows > .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .list-rows > .row:last-child { border-bottom: 0; }
    .list-rows > .row .title { font-size: 14px; font-weight: 700; }
    .list-rows > .row .meta { margin-top: 4px; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
    .list-rows > .row .meta .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .list-rows > .row.selected { background: linear-gradient(90deg, var(--sky-soft), transparent); margin: 0 -14px; padding: 12px 14px; border-radius: 12px; border-bottom-color: transparent; }
    .list-rows > .row .amount { text-align: right; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    .list-rows > .row .amount small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; margin-top: 3px; }
    .list-rows > .row .amount.red { color: var(--coral); }
    .list-rows > .row .amount.green { color: var(--mint-ink); }
    .list-rows > .row .amount.gray { color: var(--muted); }

    .row-direction {
      display: inline-flex; align-items: center; gap: 4px;
      height: 18px; padding: 0 6px;
      border-radius: 4px;
      background: var(--mint-soft); color: var(--mint-ink);
      font-size: 10.5px; font-weight: 700;
      margin-right: 6px;
      vertical-align: 1px;
    }
    .row-direction.red { background: var(--coral-soft); color: var(--coral-ink); }

    /* Summary band */
    .summary-band {
      display: grid; gap: 12px;
      grid-template-columns: repeat(3, 1fr);
      padding: 14px;
      border-radius: var(--r-lg);
      background: linear-gradient(120deg, var(--ink) 0%, #1e293b 100%);
      color: #fff;
    }
    .summary-band > div { position: relative; }
    .summary-band > div + div::before {
      content: ""; position: absolute; left: -6px; top: 4px; bottom: 4px;
      border-left: 1px solid rgba(255,255,255,.14);
    }
    .summary-band .label { color: rgba(255,255,255,.65); font-size: 11.5px; }
    .summary-band .value { display: block; margin-top: 5px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .summary-band .delta { display: block; margin-top: 2px; color: rgba(255,255,255,.55); font-size: 11px; }

    /* Stacked variant: each KPI on its own row, label+delta on the left,
       big value on the right — easier to scan than 3-column grid. */
    .summary-band.stack {
      display: flex; flex-direction: column;
      gap: 0;
      padding: 4px 14px;
    }
    .summary-band.stack > div {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .summary-band.stack > div + div {
      border-top: 1px solid rgba(255,255,255,.14);
    }
    .summary-band.stack > div + div::before { display: none; }
    .summary-band.stack .sb-text { display: flex; flex-direction: column; gap: 2px; }
    .summary-band.stack .sb-text .label {
      color: rgba(255,255,255,.85);
      font-size: 13.5px; font-weight: 700;
    }
    .summary-band.stack .sb-text .delta {
      color: rgba(255,255,255,.55);
      font-size: 11.5px; margin: 0;
    }
    .summary-band.stack .value {
      margin: 0;
      font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    }

    /* Period summary: dark hero card that anchors the page —
       big net amount on top, income/refund breakdown below. */
    .period-summary {
      padding: 18px 18px 16px;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0c1424 100%);
      color: #fff;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    .period-summary::after {
      content: "";
      position: absolute; right: -60px; top: -50px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0,84,255,.30), transparent);
      pointer-events: none;
    }
    .period-summary > * { position: relative; }
    .period-summary .ps-eyebrow {
      display: inline-block;
      color: rgba(255,255,255,.62); font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase;
      font-weight: 700;
    }
    .period-summary .ps-net {
      display: block;
      margin: 10px 0 2px;
      font-size: 34px; font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .period-summary .ps-net .currency {
      font-size: 17px; color: rgba(255,255,255,.55);
      margin-right: 4px; font-weight: 700;
      vertical-align: 6px;
    }
    .period-summary .ps-net-label {
      display: block;
      color: rgba(255,255,255,.55); font-size: 12px;
      margin-bottom: 14px;
    }
    .period-summary .ps-breakdown {
      display: grid; grid-template-columns: 1fr 1fr;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.12);
    }
    .period-summary .ps-cell {
      display: flex; flex-direction: column; gap: 3px;
    }
    .period-summary .ps-cell + .ps-cell {
      padding-left: 14px;
      border-left: 1px solid rgba(255,255,255,.12);
    }
    .period-summary .ps-cell-label {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.7); font-size: 11.5px;
      font-weight: 600;
    }
    .period-summary .ps-dot {
      width: 7px; height: 7px; border-radius: 50%;
      flex: 0 0 auto;
    }
    .period-summary .ps-cell.income .ps-dot { background: #34d399; }
    .period-summary .ps-cell.refund .ps-dot { background: #f87171; }
    .period-summary .ps-cell.guotong .ps-dot { background: #fbbf4f; }
    .period-summary .ps-cell.wechat  .ps-dot { background: #34d399; }
    .period-summary .ps-cell-value {
      font-size: 18px; font-weight: 700;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .period-summary .ps-cell-sub {
      color: rgba(255,255,255,.5); font-size: 11px;
    }

    /* pad 端横向 2 列布局:左侧汇总数字 + 右侧图表,缓解"头重脚轻" */
    .period-summary.split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      grid-template-rows: auto auto auto 1fr;
      column-gap: 28px;
      align-items: start;
      padding: 22px 24px;
    }
    .period-summary.split .ps-eyebrow { grid-column: 1; grid-row: 1; }
    .period-summary.split .ps-net { grid-column: 1; grid-row: 2; margin: 6px 0 2px; }
    .period-summary.split .ps-net-label { grid-column: 1; grid-row: 3; margin-bottom: 0; }
    .period-summary.split .ps-breakdown { grid-column: 1; grid-row: 4; margin-top: 16px; align-self: end; }
    .period-summary.split .ps-trend {
      grid-column: 2;
      grid-row: 1 / -1;
      margin-top: 0;
      padding-top: 0;
      padding-left: 28px;
      border-top: 0;
      border-left: 1px solid rgba(255,255,255,.12);
      align-self: center;
    }
    /* 装饰圆斑挪到左侧,避免被右侧图表盖住 */
    .period-summary.split::after {
      right: auto; left: -50px; top: -40px;
      background: radial-gradient(closest-side, rgba(0,84,255,.34), transparent);
    }

    /* In-hero trend: net amount per day, oldest -> newest. */
    .period-summary .ps-trend {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.12);
    }
    .period-summary .ps-trend .sparkline {
      height: 44px; gap: 5px;
    }
    .period-summary .ps-trend .sparkline i {
      background: linear-gradient(180deg, #4f86ff, rgba(0,84,255,.25));
      border-radius: 3px 3px 1px 1px;
      min-height: 4px;
    }
    .period-summary .ps-trend .sparkline-axis {
      display: flex; justify-content: space-between;
      margin-top: 6px;
      color: rgba(255,255,255,.5);
      font-size: 10.5px; letter-spacing: .02em;
    }
    /* Granularity segmented control sitting inside the dark hero. */
    .period-summary .seg {
      background: rgba(255,255,255,.08);
      padding: 3px;
      border-radius: 10px;
      width: 100%;
      margin-bottom: 12px;
    }
    .period-summary .seg > span {
      height: 28px;
      color: rgba(255,255,255,.62);
      font-size: 12px; font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
    }
    .period-summary .seg > span.active {
      background: #fff;
      color: var(--primary-ink);
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }
    /* Area chart — line + gradient fill, scales horizontally to fit. */
    .area-chart {
      display: block;
      width: 100%;
      height: 60px;
    }

    /* Field controls embedded inside the dark hero — translucent surfaces. */
    .period-summary .field {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
      color: #fff;
    }
    .period-summary .field.select > .leading {
      color: rgba(255,255,255,.6);
      border-right-color: rgba(255,255,255,.18);
    }
    .period-summary .field.select > .value {
      color: #fff;
    }
    .period-summary .field.select::after {
      border-right-color: rgba(255,255,255,.55);
      border-bottom-color: rgba(255,255,255,.55);
    }
    .period-summary .ps-trend-controls {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 12px;
    }

    /* Day list rendered as rows inside a single card (no card-in-card). */
    .day-list-card { padding: 0; overflow: hidden; }
    /* 搜索条嵌入 day-list-card / pad-table 顶部:与下方列表无缝拼接 */
    .day-list-card .list-search-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .card > .search + .pad-table { margin-top: 12px; }

    /* 结算报表逐笔流水卡片行 */
    .settle-record {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    .day-list-card .settle-record:last-child { border-bottom: 0; }
    .settle-record.clickable { cursor: pointer; transition: background .15s ease; }
    .settle-record.clickable:hover,
    .settle-record.clickable:active { background: var(--page); }

    .settle-record .sr-body { min-width: 0; }
    .settle-record .sr-title {
      font-size: 14.5px; font-weight: 700; color: var(--ink);
      line-height: 1.4;
      word-break: break-all;
    }
    .settle-record .sr-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: var(--soft);
      margin-top: 4px;
      word-break: break-all;
    }
    .settle-record .sr-line {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.55;
      word-break: break-all;
    }

    .settle-record .sr-side {
      display: flex; flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex: 0 0 auto;
      min-width: 76px;
    }
    .settle-record .sr-amount {
      font-size: 17px; font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      letter-spacing: -.01em;
    }
    .settle-record .sr-fee {
      font-size: 11.5px; color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }
    .settle-record .sr-tag {
      height: 20px; padding: 0 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink-2);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center;
      white-space: nowrap;
    }
    .settle-record .sr-tag.green { background: var(--mint-soft); color: var(--mint-ink); }
    .settle-record .sr-tag.wechat { background: var(--mint-soft); color: var(--mint-ink); }

    /* pad 端略宽松 */
    .pad .settle-record { padding: 16px 18px; }
    .pad .settle-record .sr-title { font-size: 15px; }
    .pad .settle-record .sr-amount { font-size: 18px; }
    .day-row-item {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .day-row-item:last-child { border-bottom: 0; }
    .day-row-item.clickable { cursor: pointer; transition: background .15s ease; }
    .day-row-item.clickable:active,
    .day-row-item.clickable:hover { background: var(--page); }
    .day-row-item .dri-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px;
    }
    .day-row-item .dri-date {
      font-size: 14px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .day-row-item .dri-net {
      font-size: 17px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .day-row-item .dri-meta {
      display: flex; flex-wrap: wrap; gap: 14px;
      color: var(--muted); font-size: 12px;
      line-height: 1;
    }
    .day-row-item .dri-stat {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .day-row-item .dri-stat::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      flex: 0 0 auto;
    }
    .day-row-item .dri-stat.income::before  { background: var(--mint); }
    .day-row-item .dri-stat.refund::before  { background: var(--coral); }
    .day-row-item .dri-stat.muted::before   { background: var(--soft); }
    .day-row-item .dri-stat.guotong::before { background: var(--amber); }
    .day-row-item .dri-stat.wechat::before  { background: var(--mint); }
    .day-row-item .dri-stat b {
      color: var(--ink); font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .day-row-item .dri-stat.muted b { color: var(--muted); font-weight: 600; }
    .day-row-item .dri-bar { height: 5px; }

    /* List footer: pull-to-load hint or end-of-list terminator. */
    .day-list-footer {
      display: flex; justify-content: center; align-items: center;
      gap: 8px;
      padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--soft); font-size: 12px;
    }
    .day-list-footer .pull-arrow {
      display: inline-grid; place-items: center;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--muted);
      font-size: 11px; font-weight: 700;
    }
    .day-list-footer .pull-progress { color: var(--muted); }
    .day-list-footer .pull-progress b { color: var(--ink); font-weight: 700; }

    /* Per-day summary card: head = date + net amount; body = income / refund rows. */
    .day-list { display: flex; flex-direction: column; gap: 12px; }
    .day-card {
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .day-card-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 10px;
    }
    .day-card-head .day-date {
      font-size: 14px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .day-card-head .day-net {
      font-size: 18px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .day-card-head .day-net-label {
      color: var(--muted); font-size: 11.5px; font-weight: 600;
      margin-right: 6px;
    }
    .day-card-body { display: flex; flex-direction: column; gap: 6px; }
    .day-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
    }
    .day-row.income { background: var(--mint-soft); color: var(--mint-ink); }
    .day-row.refund { background: var(--coral-soft); color: var(--coral-ink); }
    .day-row.muted  { background: var(--bg); color: var(--muted); }
    .day-row .day-tag { font-weight: 700; }
    .day-row .day-amt {
      font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .day-card .bar { margin-top: 10px; }

    /* KPI rows: label left + value right on a single line, vertically stacked. */
    .kpi-rows { display: flex; flex-direction: column; gap: 8px; }
    .kpi-rows > .kpi-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg);
    }
    .kpi-rows > .kpi-row > span { color: var(--muted); font-size: 13px; font-weight: 600; }
    .kpi-rows > .kpi-row > b { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .kpi-rows > .kpi-row.bordered { background: #fff; border: 1px solid var(--line); }
    .kpi-rows > .kpi-row.accent-amber { background: var(--amber-soft); }
    .kpi-rows > .kpi-row.accent-amber > b { color: var(--amber-ink); }
    .kpi-rows > .kpi-row.accent-sky { background: var(--primary-soft); }
    .kpi-rows > .kpi-row.accent-sky > b { color: var(--primary-ink); }
    .kpi-rows > .kpi-row.accent-mint { background: var(--mint-soft); }
    .kpi-rows > .kpi-row.accent-mint > b { color: var(--mint-ink); }

    /* Empty state */
    .empty {
      padding: 32px 20px;
      text-align: center;
      border-radius: var(--r-lg);
      background: #fff;
      border: 1px dashed var(--line-strong);
    }
    .empty .empty-icon {
      width: 56px; height: 56px;
      margin: 0 auto 12px;
      display: grid; place-items: center;
      border-radius: 16px;
      background: var(--bg); color: var(--muted);
    }
    .empty b { display: block; font-size: 15px; }
    .empty p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .empty .actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }

    /* Banner */
    .banner {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 12px; align-items: center;
      padding: 12px 14px;
      border-radius: var(--r-md);
    }
    .banner.success { background: var(--mint-soft); border: 1px solid #bbf7d0; }
    .banner.danger { background: var(--coral-soft); border: 1px solid #fecaca; }
    .banner.info { background: var(--sky-soft); border: 1px solid #cfdcff; }
    .banner .b-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; }
    .banner .b-text b { display: block; font-size: 14px; }
    .banner .b-text small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* Detail amount summary */
    .amount-summary {
      padding: 18px;
      border-radius: var(--r-lg);
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .amount-summary .label { display: block; color: var(--muted); font-size: 12px; }
    .amount-summary .amount {
      display: block; margin: 8px 0 4px;
      font-size: 36px; font-weight: 700; letter-spacing: -0.02em;
    }
    .amount-summary .amount .currency { font-size: 18px; color: var(--muted); font-weight: 700; vertical-align: 8px; margin-right: 2px; }
    .amount-summary .meta { color: var(--muted); font-size: 12.5px; }

    /* Sortable list */
    .sortable .sort-item {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 10px; align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .sortable .sort-item:last-child { border-bottom: 0; }
    .drag-handle {
      width: 20px; height: 28px; color: var(--soft); cursor: grab;
      display: grid; place-items: center;
    }
    .sortable b { display: block; font-size: 14px; font-weight: 700; }
    .sortable small { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }

    /* Switch */
    .switch {
      width: 42px; height: 24px; border-radius: 999px;
      background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 2px rgba(15,23,42,.18); transition: left .15s;
    }
    .switch.on { background: var(--mint); }
    .switch.on::after { left: 21px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 26px; padding: 0 10px;
      border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .status-pill.default { background: var(--sky-soft); color: var(--sky-ink); }
    .status-pill.enabled { background: var(--mint-soft); color: var(--mint-ink); }
    .status-pill.disabled { background: var(--bg); color: var(--muted); }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Sticky footer for save/confirm */
    .sticky-footer {
      position: sticky; bottom: 0;
      margin: 0 -14px -14px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .sticky-footer .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

    /* Phone tab bar (visual only) */
    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .tabbar button {
      display: grid; place-items: center;
      gap: 2px;
      border: 0; background: transparent;
      color: var(--muted); font-size: 10.5px; font-weight: 700;
      padding: 4px 0;
    }
    .tabbar button.active { color: var(--sky-ink); }
    .tabbar svg { width: 22px; height: 22px; }

    /* iPad shell */
    .pad-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 660px;
    }

    .pad-nav {
      height: 60px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .pad-nav .nav-left { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
    .pad-nav .nav-right { justify-self: end; display: inline-flex; align-items: center; gap: 8px; }
    .pad-nav h2 {
      margin: 0;
      text-align: center;
      font-size: 16px; font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pad-back {
      display: inline-flex; align-items: center; gap: 4px;
      height: 36px; padding: 0 12px 0 6px;
      border: 0; border-radius: 10px;
      background: transparent; color: var(--primary);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      max-width: 100%;
    }
    .pad-back:hover { background: var(--primary-soft); }
    .pad-back svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .pad-back span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .pad-subtabs {
      display: flex;
      gap: 2px;
      padding: 0 20px;
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
      overflow-x: auto;
    }
    .pad-subtabs button {
      height: 44px; padding: 0 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .pad-subtabs button:hover { color: var(--ink); }
    .pad-subtabs button.active { color: var(--primary-ink); }
    .pad-subtabs button.active::after {
      content: "";
      position: absolute;
      left: 12px; right: 12px; bottom: -1px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    .pad-main {
      padding: 20px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
    }
    .pad-main > * + * { margin-top: 14px; }
    .pad-grid > div > * + * { margin-top: 14px; }
    .pad-header {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
      margin-bottom: 14px;
    }
    .pad-header h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
    .pad-header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .pad-header .actions { display: flex; gap: 8px; }

    .pad-grid {
      display: grid; gap: 14px;
      grid-template-columns: 1.05fr .95fr;
      align-items: start;
    }
    .pad-grid.equal { grid-template-columns: 1fr 1fr; }
    .pad-grid.master-detail { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }

    .pad-kpis {
      display: grid; gap: 12px;
      grid-template-columns: repeat(4, 1fr);
    }
    .pad-kpi {
      padding: 14px;
      border-radius: var(--r-lg);
      background: #fff;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all .15s ease;
    }
    .pad-kpi:hover { transform: translateY(-1px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
    .pad-kpi header { display: flex; align-items: center; gap: 8px; }
    .pad-kpi .title { font-size: 13px; color: var(--muted); }
    .pad-kpi .value { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .pad-kpi .footer { margin-top: 4px; color: var(--muted); font-size: 11.5px; }

    /* Pad table */
    .pad-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pad-table th {
      text-align: left;
      padding: 10px 8px;
      color: var(--muted); font-weight: 600; font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    .pad-table th:last-child, .pad-table td:last-child { text-align: right; }
    .pad-table td {
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
    }
    .pad-table tr:last-child td { border-bottom: 0; }
    .pad-table tr.row { cursor: pointer; }
    .pad-table tr.row:hover { background: var(--page); }
    .pad-table tr.row.selected { background: var(--sky-soft); }
    .pad-table .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
    .pad-table .amt { font-weight: 700; }
    .pad-table .amt.red { color: var(--coral); }
    .pad-table .amt.green { color: var(--mint-ink); }

    /* Inline sparkline-like bar */
    .bar {
      position: relative; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden;
    }
    .bar > i {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--sky), var(--violet));
      border-radius: 999px;
    }

    /* Sparkline (CSS bar chart) */
    .sparkline {
      display: flex; align-items: flex-end; gap: 4px; height: 56px;
    }
    .sparkline i {
      flex: 1;
      background: linear-gradient(180deg, var(--sky), #93c5fd);
      border-radius: 4px 4px 2px 2px;
      min-height: 4px;
    }
    .sparkline.amber i { background: linear-gradient(180deg, var(--amber), #fcd34d); }
    .sparkline.mint i { background: linear-gradient(180deg, var(--mint), #6ee7b7); }

    @media (max-width: 1180px) {
      .devices { grid-template-columns: 1fr; }
      .phone-shell { max-width: 420px; }
      .top { display: block; }
      .route-tabs { justify-content: flex-start; margin-top: 12px; max-width: 100%; }
    }

    @media (max-width: 720px) {
      .stage { width: calc(100vw - 16px); margin-top: 16px; }
      .phone-shell, .pad-shell { padding: 8px; }
      .pad-grid, .pad-grid.master-detail, .pad-grid.equal { grid-template-columns: 1fr; }
      .pad-kpis { grid-template-columns: repeat(2, 1fr); }
      .quick { grid-template-columns: 1fr; }
      .summary-band { grid-template-columns: 1fr 1fr; }
      .summary-band > div:nth-child(3) { grid-column: 1 / -1; }
    }
  </style>

    function chartPanel({ chip, trendMap, gradientId, lineColor, areaColor, customRange, axisCenter, onChipSelect }) {
      const chipOptions = [
        ["7天", "7 天"],
        ["30天", "30 天"],
        ["90天", "90 天"],
        ["自定义", "自定义"]
      ];
      const trendKey = chipToTrend[chip] || "7d";
      const trend = trendMap[trendKey];
      const trendMax = Math.max(...trend.buckets, 1);
      const VW = 300, VH = 60, padTop = 6;
      const n = trend.buckets.length;
      const pts = trend.buckets.map((v, i) => {
        const x = n === 1 ? VW / 2 : (i / (n - 1)) * VW;
        const y = VH - (v / trendMax) * (VH - padTop);
        return [x.toFixed(1), y.toFixed(1)];
      });
      const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p[0]} ${p[1]}`).join(" ");

      const isCustom = chip === "自定义";
      const range = isCustom ? (customRange || customRangeDefault) : trend.axis;
      return `

        </svg>
        <div class="sparkline-axis">
          <span>${range.from}</span>
          <span>${axisCenter || trend.label}</span>
          <span>${range.to}</span>
        </div>`;

      const back = parentOf[current];
      const parentRoute = back ? routes.find(r => r.key === back) : null;
      // overview 是本功能入口,返回应用主页(原型中无父级,点击无副作用)
      const backLabel = parentRoute ? parentRoute.label : "返回";
      const backOnClick = parentRoute ? `setRoute('${back}')` : "void 0";
      return `
        <div class="pad-nav">
          <div class="nav-left">
            <button class="pad-back" onclick="${backOnClick}" aria-label="返回">
              ${icon("back")}<span>${backLabel}</span>
            </button>
          </div>
          <h2>${pageTitle()}</h2>
          <div class="nav-right">${padNavActions[current] || ""}</div>
        </div>`;
    }

    function padSubTabs() {
      const r = routes.find(x => x.key === current);
      if (!r) return "";
      const tabs = padSubTabsMap[r.group];
      if (!tabs || !tabs.includes(current)) return "";
      return `
        <div class="pad-subtabs" role="tablist">
          ${tabs.map(k => {
            const t = routes.find(x => x.key === k);
            return `<button role="tab" class="${k === current ? "active" : ""}" onclick="setRoute('${k}')">${t.label}</button>`;
          }).join("")}
        </div>`;
    }

    function renderPad() {
      document.getElementById("pad").innerHTML = `
        ${statusBar()}
        <div class="pad-layout">
          ${padNav()}
          ${padSubTabs()}
          <section class="pad-main">${padPages[current]()}</section>
        </div>
      `;
    }

    renderTabs();
    renderPhone();
    renderPad();
  </script>
</body>
</html>
